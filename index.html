<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinguaFriend 🎓</title>
<style>
:root{
  --bg:#0d1020; --panel:#161a2e; --panel2:#1e2440; --text:#eef0ff;
  --muted:#8b93b8; --accent:#7c5cff; --accent2:#22d3ee;
  --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f4f6ff; --panel:#fff; --panel2:#eef1ff; --text:#12162b;
  --muted:#5b6285; --shadow:0 10px 30px rgba(80,90,160,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;transition:.2s}
button{font:inherit;cursor:pointer}
.app{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:24px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card-panel{background:var(--panel);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;
  text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--panel2);
  background:var(--bg);color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:16px;
  transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--panel2);font-size:13px;
  border:1px solid transparent;transition:.15s;cursor:pointer}
.chip.active{border-color:var(--accent);color:var(--accent)}
.deck-item{display:flex;justify-content:space-between;align-items:center;
  padding:12px;border-radius:12px;background:var(--panel2);margin-bottom:8px;
  font-size:14px;cursor:pointer}
.deck-item:hover{outline:1px solid var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat span{font-size:11px;color:var(--muted)}
.flash-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:420px;gap:20px}
.flash{width:100%;max-width:460px;height:280px;perspective:1200px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;
  transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;box-shadow:var(--shadow)}
.front{background:linear-gradient(135deg,var(--panel),var(--panel2))}
.back{background:linear-gradient(135deg,#1b3b6f,#7c5cff);color:#fff;transform:rotateY(180deg)}
.word{font-size:34px;font-weight:700;margin:0}
.transcription{color:var(--muted);margin-top:6px;font-size:15px}
.back .word{color:#fff}
.example{margin-top:14px;font-size:14px;opacity:.9;font-style:italic}
.example-ru{font-size:13px;opacity:.75;margin-top:4px}
.hint{margin-top:10px;font-size:12px;padding:6px 10px;border-radius:8px;
  background:rgba(255,255,255,.15)}
.speak{position:absolute;top:14px;right:14px;background:transparent;border:0;
  font-size:20px;color:inherit}
.rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rate button{padding:10px 18px;border:0;border-radius:12px;font-weight:600;color:#fff}
.rate .again{background:var(--bad)}
.rate .hard{background:var(--warn)}
.rate .good{background:var(--good)}
.rate .easy{background:var(--accent)}
.progress{width:100%;max-width:460px;height:6px;background:var(--panel2);
  border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  width:0;transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--accent);color:#fff;padding:12px 20px;border-radius:12px;
  transition:.3s;box-shadow:var(--shadow);z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <header>
    <div>
      <h1>LinguaFriend 🎓</h1>
      <div class="sub">Умный тренажёр английского · работает офлайн</div>
    </div>
    <button class="btn ghost" style="width:auto;margin:0;padding:10px 16px"
            onclick="toggleTheme()">🌓</button>
  </header>

  <div class="grid">
    <div>
      <div class="card-panel">
        <label>Твой уровень</label>
        <select id="level">
          <option value="A1">A1 — Beginner</option>
          <option value="A2" selected>A2 — Elementary</option>
          <option value="B1">B1 — Intermediate</option>
          <option value="B2">B2 — Upper-Int</option>
          <option value="C1">C1 — Advanced</option>
        </select>
        <label>Тема</label>
        <div class="topics" id="topics"></div>
        <label>Сколько карточек</label>
        <select id="count">
          <option>5</option><option selected>10</option>
          <option>15</option><option>20</option>
        </select>
        <button class="btn" onclick="createDeck()">✨ Сгенерировать карточки</button>
      </div>

      <div class="card-panel" style="margin-top:16px">
        <label>Мои наборы</label>
        <div id="decks"></div>
      </div>

      <div class="card-panel" style="margin-top:16px">
        <label>Статистика</label>
        <div class="stats">
          <div class="stat"><b id="stTotal">0</b><span>всего слов</span></div>
          <div class="stat"><b id="stLearned">0</b><span>выучено</span></div>
          <div class="stat"><b id="stToday">0</b><span>сегодня</span></div>
        </div>
        <div class="stats" style="grid-template-columns:1fr">
          <div class="stat"><b id="stAcc">0%</b><span>средняя точность</span></div>
        </div>
      </div>
    </div>

    <div class="card-panel" id="studyPanel">
      <div class="empty">
        <div style="font-size:48px">🃏</div>
        <p>Выбери тему слева и нажми «Сгенерировать»,<br>или открой готовый набор — и начнём!</p>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ================== LOCALSTORAGE ================== */
const LS_KEY = "linguafriend_v1";
function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {decks:[], nextId:1, reviews:[]}; }
  catch(e){ return {decks:[], nextId:1, reviews:[]}; }
}
function saveState(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
let DB = loadState();

/* ================== UI ================== */
const $ = id => document.getElementById(id);
const state = { topic:null, cards:[], index:0, flipped:false, deckId:null };

const TOPIC_LIST = [
  {id:"numbers",name:"Числа",emoji:"🔢"},
  {id:"colors",name:"Цвета",emoji:"🎨"},
  {id:"animals",name:"Животные",emoji:"🐾"},
  {id:"food",name:"Еда",emoji:"🍎"},
  {id:"travel",name:"Путешествия",emoji:"✈️"},
  {id:"emotions",name:"Эмоции",emoji:"😊"},
  {id:"technology",name:"Технологии",emoji:"💻"},
  {id:"business",name:"Бизнес",emoji:"💼"},
  {id:"phrasal verbs",name:"Фразовые глаголы",emoji:"🔗"},
  {id:"idioms",name:"Идиомы",emoji:"💬"}
];

$('topics').innerHTML = TOPIC_LIST.map(t =>
  `<div class="chip" onclick="pickTopic('${t.id}', this)">${t.emoji} ${t.name}</div>`
).join('');

function pickTopic(id, el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); state.topic = id;
}
function toggleTheme(){
  const b = document.body;
  b.dataset.theme = b.dataset.theme==='dark' ? 'light' : 'dark';
}
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================== ГЕНЕРАЦИЯ КАРТОЧЕК ================== */
const LEVEL_ORDER = ["A1","A2","B1","B2","C1"];
function pickByLevel(pool, level, count){
  const idx = LEVEL_ORDER.indexOf(level);
  const allowed = LEVEL_ORDER.slice(0, idx+1);
  let filtered = pool.filter(w => allowed.includes(w.lvl));
  if(filtered.length < count){
    filtered = pool.slice();
  }
  const shuffled = filtered.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0, Math.min(count, shuffled.length));
}

function createDeck(){
  if(!state.topic){ toast('Сначала выбери тему 👆'); return; }
  const level = $('level').value;
  const count = +$('count').value;
  const pool = VOCAB[state.topic] || [];
  if(!pool.length){ toast('Для этой темы пока нет слов 😢'); return; }

  const picked = pickByLevel(pool, level, count);
  if(!picked.length){ toast('Не удалось подобрать слова'); return; }

  const deck = {
    id: DB.nextId++,
    topic: state.topic,
    level,
    created: Date.now(),
    cards: picked.map((w,i) => ({
      id: DB.nextId++,
      word: w.en, translation: w.ru, transcription: w.tr,
      example: w.ex, example_ru: w.exru, hint: `Уровень ${w.lvl}`,
      ease: 2.5, interval: 0, reps: 0,
      due: todayStr()
    }))
  };
  DB.decks.push(deck);
  saveState(DB);
  toast(`Готово! ${deck.cards.length} карточек создано ✨`);
  renderDecks();
  startDeck(deck.id);
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

/* ================== НАБОРЫ ================== */
function renderDecks(){
  const el = $('decks');
  if(!DB.decks.length){ el.innerHTML = '<div style="color:var(--muted);font-size:13px">Пока пусто</div>'; return; }
  el.innerHTML = DB.decks.slice().reverse().map(d => {
    const studied = d.cards.filter(c=>c.reps>0).length;
    return `<div class="deck-item" onclick="startDeck(${d.id})">
      <span>📚 <b>${d.topic}</b> · ${d.level}</span>
      <span style="color:var(--muted);font-size:12px">${studied}/${d.cards.length}</span>
    </div>`;
  }).join('');
}

/* ================== ИЗУЧЕНИЕ ================== */
function startDeck(id){
  const deck = DB.decks.find(d => d.id === id);
  if(!deck) return;
  state.deckId = id;
  const today = todayStr();
  const due = deck.cards.filter(c => c.due <= today);
  if(!due.length){
    $('studyPanel').innerHTML = `<div class="empty">
      <div style="font-size:48px">🎉</div>
      <p>Все карточки этого набора на сегодня пройдены!<br>
      Возвращайся завтра или создай новый набор.</p></div>`;
    return;
  }
  state.cards = due; state.index = 0;
  renderCard();
}

function renderCard(){
  const c = state.cards[state.index];
  if(!c){ finishStudy(); return; }
  state.flipped = false;
  const pct = Math.round(state.index/state.cards.length*100);
  $('studyPanel').innerHTML = `
    <div class="flash-wrap">
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="flash" id="flash" onclick="flip()">
        <div class="flash-inner">
          <div class="face front">
            <button class="speak" onclick="event.stopPropagation();speak('${escAttr(c.word)}')">🔊</button>
            <div class="word">${c.word}</div>
            ${c.transcription ? `<div class="transcription">${c.transcription}</div>` : ''}
            <div class="transcription" style="margin-top:20px;font-size:12px">
              нажми на карточку, чтобы перевернуть
            </div>
          </div>
          <div class="face back">
            <button class="speak" onclick="event.stopPropagation();speak('${escAttr(c.word)}')">🔊</button>
            <div class="word">${c.translation}</div>
            ${c.example ? `<div class="example">${c.example}</div>` : ''}
            ${c.example_ru ? `<div class="example-ru">${c.example_ru}</div>` : ''}
            ${c.hint ? `<div class="hint">💡 ${c.hint}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="rate">
        <button class="again" onclick="rate(0)" disabled style="opacity:.35">Снова</button>
        <button class="hard"  onclick="rate(1)" disabled style="opacity:.35">Трудно</button>
        <button class="good"  onclick="rate(2)" disabled style="opacity:.35">Хорошо</button>
        <button class="easy"  onclick="rate(3)" disabled style="opacity:.35">Легко</button>
      </div>
      <div class="sub">Карточка ${state.index+1} из ${state.cards.length}</div>
    </div>`;
}
function escAttr(s){
  return String(s).replace(/'/g,"\\'").replace(/"/g,"&quot;");
}
function flip(){
  state.flipped = !state.flipped;
  $('flash').classList.toggle('flipped', state.flipped);
  document.querySelectorAll('.rate button').forEach(b => {
    b.disabled = !state.flipped;
    b.style.opacity = state.flipped ? 1 : .35;
  });
}

function rate(q){
  const c = state.cards[state.index];
  // SM-2
  if(q === 0){
    c.reps = 0; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2);
  } else {
    c.reps += 1;
    if(c.reps === 1) c.interval = 1;
    else if(c.reps === 2) c.interval = 3;
    else c.interval = Math.round(c.interval * c.ease);
    if(q === 1) c.ease = Math.max(1.3, c.ease - 0.15);
    if(q === 3) c.ease = c.ease + 0.15;
  }
  c.due = addDays(todayStr(), c.interval);

  DB.reviews.push({cardId: c.id, quality: q, ts: Date.now()});
  saveState(DB);
  loadStats();

  state.index++;
  renderCard();
}

function finishStudy(){
  $('studyPanel').innerHTML = `<div class="empty">
    <div style="font-size:48px">🏆</div>
    <p>Отличная работа! Все карточки на сегодня пройдены.</p>
    <button class="btn" style="width:auto;padding:10px 20px;margin-top:16px"
      onclick="renderDecks()">К наборам</button>
  </div>`;
}

function speak(text){
  if(!('speechSynthesis' in window)){ toast('Озвучка не поддерживается'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = .9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ================== СТАТИСТИКА ================== */
function loadStats(){
  let total = 0, learned = 0;
  DB.decks.forEach(d => d.cards.forEach(c => {
    total++; if(c.reps >= 3) learned++;
  }));
  const today = todayStr();
  const todayCount = DB.reviews.filter(r => new Date(r.ts).toISOString().slice(0,10) === today).length;
  const avg = DB.reviews.length
    ? Math.round(DB.reviews.reduce((s,r)=>s+r.quality,0) / DB.reviews.length / 3 * 100)
    : 0;
  $('stTotal').textContent = total;
  $('stLearned').textContent = learned;
  $('stToday').textContent = todayCount;
  $('stAcc').textContent = avg + '%';
}

/* ================== КЛАВИАТУРА ================== */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if(e.code === 'Space'){ e.preventDefault(); if(!state.flipped) flip(); }
  if(state.flipped){
    if(e.key === '1') rate(0);
    if(e.key === '2') rate(1);
    if(e.key === '3') rate(2);
    if(e.key === '4') rate(3);
  }
});

/* ================== СТАРТ ================== */
renderDecks();
loadStats();
</script>
